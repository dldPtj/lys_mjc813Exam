spring:
  application:
    name: cinema_crud
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cinema_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: cinema_user
    password: qwer1234!
  mustache:
    prefix: classpath:/templates/
    suffix: .html
    enabled: true
    charset: UTF-8
    servlet:
      cache: false
server:
  port: 8000
  servlet:
    encoding:
      force: true
      enabled: true
      charset: UTF-8
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.mjc813.cinema_crud
  configuration:
    map-underscore-to-camel-case: true

