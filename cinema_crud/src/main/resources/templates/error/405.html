<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>405 error</title>
</head>
<body>
    <h1>405 error occurred!</h1>
    <hr>
    Please check your URL...
    <br>
    허용되지 않는 메서드입니다.<br>
    서버가 클라이언트가 요청한 HTTP 메서드를 해당 리소스에서 지원하지 않을 때 발생합니다.<br>
    (예를 들어, 서버에서 GET 요청만 허용하는데, 클라이언트가 POST 요청을 보낼 경우 405 에러가 발생합니다.)
</body>
</html>
