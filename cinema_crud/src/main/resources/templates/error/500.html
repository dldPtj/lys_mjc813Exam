<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>500 error</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 48px;
            color: #dc3545;
            margin-bottom: 16px;
        }

        p {
            font-size: 18px;
            margin: 8px 0;
        }

        .back-button {
            margin-top: 24px;
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>500 error occurred!</h1>
    <p>Please check your URL</p>
    <p>서버에서 에러가 발생했습니다. 서버 관리자에게 문의하세요. (이메일 주소, 고객센터)</p>
    <a href="/" class="back-button">Go Back to Home</a>
</div>
</body>
</html>
