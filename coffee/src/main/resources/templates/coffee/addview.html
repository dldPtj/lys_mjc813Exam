<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Coffee 메뉴 추가</title>
</head>
<body>
    <h1>Coffee 추가</h1>
    <form method="post" action="/coffee/insert">
        <label for="name">커피 이름 : </label><input type="text" id="name" name="name" value="" maxlength="30" /> <br />
        <label for="price">커피 가격 : </label><input type="number" id="price" name="price" value="0" /> <br />
        <label for="source">원두 원산지 : </label><input type="text" id="source" name="source" value="" maxlength="30" /> <br />
        <label for="shots">커피 샷 수 : </label><input type="number" id="shots" name="shots" value="0" /> <br />
        <input type="submit" value="커피추가" />
    </form>
</body>
</html>
